version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: expense-postgres
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: expense-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/expense_tracker
      DB_USERNAME: expense_user
      DB_PASSWORD: expense_user
      JWT_SECRET: your-super-secure-256-bit-secret-key-change-this
      SPRING_PROFILES_ACTIVE: prod

volumes:
  postgres_data:
